name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Install a browser
        run: pnpm --filter @openchat/e2e exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Fail if generated files changed
        run: git diff --exit-code
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  upgrade:
    # A release's Worker writes data, this commit's migrations and Worker take over, then the release runs
    # again on the new schema, as after oc rollback. Local Wrangler only. See docs/operations/deployment.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upgrade from the oldest supported release, then roll back
        run: pnpm test:upgrade --from v0.1.0

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI (MIT). The GitHub Action needs a paid licence for an organisation's repositories.
      - name: Scan the whole history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  dco:
    # Dependabot cannot sign off, so its own pull requests are exempt.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit has a sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/check-dco.mjs "$BASE" "$HEAD"
